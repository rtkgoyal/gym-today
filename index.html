<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gym Today</title>
<meta name="description" content="Today's workout with animated form guides, ticks and timers.">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gym Today">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
:root{
  --bg:#F2F2F7;--card:#FFFFFF;--thumb:#F2F2F5;--elev:#FFFFFF;
  --label:#000000;--label2:rgba(60,60,67,.62);--label3:rgba(60,60,67,.3);--sep:rgba(60,60,67,.14);
  --fill:rgba(120,120,128,.12);--fill2:rgba(120,120,128,.2);
  --blue:#007AFF;--green:#34C759;--teal:#30B0C7;--mint:#00C3B5;--orange:#FF9500;--pink:#FF2D55;--indigo:#5856D6;--purple:#AF52DE;--red:#FF3B30;
  --prop:#B3B7C1;--prop2:#D7D9DF;--propLine:#8E8E93;
  --bar:rgba(242,242,247,.78);--scrim:rgba(0,0,0,.28);
  --cta:#000000;--ctaText:#FFFFFF;
  --shadow:0 .5px 0 rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
  --r:16px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",Roboto,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000;--card:#1C1C1E;--thumb:#2A2A2D;--elev:#2C2C2E;
  --label:#FFFFFF;--label2:rgba(235,235,245,.62);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.55);
  --fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.36);
  --blue:#0A84FF;--green:#30D158;--teal:#40C8E0;--mint:#63E6E2;--orange:#FF9F0A;--pink:#FF375F;--indigo:#7D7AFF;--purple:#BF5AF2;--red:#FF453A;
  --prop:#5C5C63;--prop2:#3D3D42;--propLine:#98989F;
  --bar:rgba(18,18,20,.72);--scrim:rgba(0,0,0,.5);
  --cta:#FFFFFF;--ctaText:#000000;
  --shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000;--card:#1C1C1E;--thumb:#2A2A2D;--elev:#2C2C2E;
  --label:#FFFFFF;--label2:rgba(235,235,245,.62);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.55);
  --fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.36);
  --blue:#0A84FF;--green:#30D158;--teal:#40C8E0;--mint:#63E6E2;--orange:#FF9F0A;--pink:#FF375F;--indigo:#7D7AFF;--purple:#BF5AF2;--red:#FF453A;
  --prop:#5C5C63;--prop2:#3D3D42;--propLine:#98989F;
  --bar:rgba(18,18,20,.72);--scrim:rgba(0,0,0,.5);
  --cta:#FFFFFF;--ctaText:#000000;
  --shadow:none;color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:10px}
a{color:inherit;text-decoration:none}
svg{display:block}
.num{font-family:var(--round);font-variant-numeric:tabular-nums}

/* accent helpers */
.c-teal{--fc:var(--teal)}.c-mint{--fc:var(--mint)}.c-orange{--fc:var(--orange)}.c-pink{--fc:var(--pink)}.c-indigo{--fc:var(--indigo)}.c-purple{--fc:var(--purple)}.c-green{--fc:var(--green)}

/* ---------- app shell ---------- */
#app{max-width:560px;margin:0 auto;padding:0 16px 40px;min-height:100%}
.nav{position:sticky;top:0;z-index:20;margin:calc(-1 * env(safe-area-inset-top,0px)) -16px 0;padding:calc(env(safe-area-inset-top,0px) + 6px) 16px 6px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:calc(env(safe-area-inset-top,0px) + 50px);transition:background .25s,box-shadow .25s}
.nav.solid{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.nav .mid{font-weight:600;font-size:17px;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;white-space:nowrap}
.nav.solid .mid{opacity:1;transform:none}
.nav .lft{justify-self:start}.nav .rgt{justify-self:end;display:flex;gap:10px}
.icbtn{width:34px;height:34px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--label)}
.icbtn svg{width:18px;height:18px}
.txtbtn{color:var(--orange);font-weight:600;font-size:16px;padding:6px 0;display:flex;align-items:center;gap:4px}
.txtbtn svg{width:14px;height:14px}

.hdr{padding:2px 0 14px}
.hdr .kick{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.02em}
.hdr h1{margin:2px 0 0;font-size:34px;line-height:41px;font-weight:800;letter-spacing:.012em}

/* ---------- week strip ---------- */
.week{background:var(--card);border-radius:var(--r);padding:10px 8px 12px;box-shadow:var(--shadow);touch-action:pan-y}
.wkh{display:flex;align-items:center;justify-content:space-between;padding:0 6px 8px}
.wkh .t{font-size:13px;font-weight:600;color:var(--label2)}
.wkh .ar{display:flex;gap:4px}
.wkh .ar button{width:30px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--label2)}
.wkh .ar button:active{background:var(--fill)}
.wkh .ar svg{width:14px;height:14px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;padding:2px 0}
.day .dl{font-size:12px;font-weight:600;color:var(--label3)}
.day .dc{position:relative;width:38px;height:38px;display:grid;place-items:center}
.day .dc svg{position:absolute;inset:0;width:38px;height:38px}
.day .dn{position:relative;font-family:var(--round);font-size:16px;font-weight:600;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.day.rest .dn{color:var(--label2);font-weight:500}
.day.today .dn{color:var(--orange)}
.day.sel .dn{background:var(--label);color:var(--bg)}
.day.today.sel .dn{background:var(--orange);color:#fff}
.day .tr{fill:none;stroke:var(--fill2);stroke-width:3}
.day .pg{fill:none;stroke:var(--green);stroke-width:3;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dasharray .5s}
.day.rest .tr{stroke:transparent}

/* ---------- hero ---------- */
.hero{margin-top:14px;background:var(--card);border-radius:22px;padding:18px 18px 16px;box-shadow:var(--shadow)}
.hero .top{display:flex;gap:14px;align-items:flex-start}
.hero .tt{flex:1;min-width:0}
.hero .tag{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.02em}
.hero h2{margin:3px 0 0;font-size:26px;line-height:31px;font-weight:800;letter-spacing:.01em;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:13px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--fill);color:var(--label2);white-space:nowrap}
.chip.acc{background:color-mix(in srgb,var(--fc) 16%,transparent);color:var(--fc)}
.ring{width:64px;height:64px;flex:none;position:relative}
.ring svg{width:64px;height:64px}
.ring .tr{fill:none;stroke:var(--fill);stroke-width:7}
.ring .pg{fill:none;stroke:var(--green);stroke-width:7;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dasharray .6s cubic-bezier(.2,.8,.2,1)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--round);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.ring .v svg{width:22px;height:22px;color:var(--green)}
.upn{display:flex;gap:12px;align-items:center;margin-top:16px;padding:10px;border-radius:16px;background:var(--thumb);text-align:left;width:100%}
.upn .fbox{width:84px;height:84px;flex:none;border-radius:12px;background:var(--tb,var(--thumb))}
.upn .k{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--fc)}
.upn .n{font-size:17px;font-weight:600;margin-top:2px;line-height:1.25}
.upn .d{font-size:15px;color:var(--label2);margin-top:2px}
.upn .ch{margin-left:auto;color:var(--label3)}
.upn .ch svg{width:13px;height:13px}
.cta{margin-top:14px;width:100%;height:52px;border-radius:14px;background:var(--cta);color:var(--ctaText);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s}
.cta:active{transform:scale(.98)}
.cta svg{width:16px;height:16px}
.cta.ghost{background:var(--fill);color:var(--label)}

/* ---------- sections ---------- */
.sec{margin-top:26px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 4px 8px}
.sh .l{min-width:0}
.sh .k{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--fc)}
.sh h3{margin:2px 0 0;font-size:22px;line-height:27px;font-weight:800;letter-spacing:.01em}
.sh .s{font-size:14px;color:var(--label2);margin-top:2px}
.sh .cnt{font-family:var(--round);font-size:15px;font-weight:600;color:var(--label2);white-space:nowrap;font-variant-numeric:tabular-nums}
.sh .cnt.done{color:var(--green)}
.note{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--label2);padding:0 4px 10px}
.note svg{width:15px;height:15px;flex:none;margin-top:2px;color:var(--fc)}
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 10px;position:relative;min-height:72px;cursor:pointer}
.row+.row::before{content:"";position:absolute;left:76px;right:0;top:0;height:.5px;background:var(--sep)}
.row:active{background:var(--fill)}
.thumb{width:54px;height:54px;flex:none;border-radius:12px;background:var(--tb,var(--thumb));overflow:hidden}
.thumb svg,.fbox svg{width:100%;height:100%}
.txt{flex:1;min-width:0}
.nm{font-size:16px;font-weight:600;line-height:1.25;display:flex;align-items:center;gap:7px;min-width:0}
.nm .lbl{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.slot{flex:none;font-family:var(--round);font-size:12px;font-weight:700;color:var(--fc);background:color-mix(in srgb,var(--fc) 15%,transparent);border-radius:6px;padding:2px 5px;font-variant-numeric:tabular-nums}
.ds{font-size:14px;color:var(--label2);margin-top:2px}
.ds .sw{color:var(--fc);font-weight:600}
.row.done .nm .lbl{color:var(--label2)}
.tick{flex:none;width:44px;height:44px;margin-right:-6px;display:grid;place-items:center}
.tick .c{width:28px;height:28px;border-radius:50%;border:2px solid var(--label3);display:grid;place-items:center;transition:background .2s,border-color .2s,transform .2s cubic-bezier(.3,1.6,.5,1)}
.tick .c svg{width:15px;height:15px;color:#fff;opacity:0;transform:scale(.4);transition:opacity .15s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.row.done .tick .c{background:var(--green);border-color:var(--green)}
.row.done .tick .c svg{opacity:1;transform:none}
.dots{flex:none;display:flex;gap:5px;padding:14px 4px 14px 8px;margin-right:-4px}
.dots i{width:11px;height:11px;border-radius:50%;border:1.6px solid var(--label3);transition:background .2s,border-color .2s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.dots i.on{background:var(--fc);border-color:var(--fc)}
.dots i.pop{transform:scale(1.35)}
.row.done .dots i.on{background:var(--green);border-color:var(--green)}
.next .thumb{box-shadow:0 0 0 2px var(--fc)}

.rules{margin-top:26px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:6px 16px}
.rules summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:10px 0;font-weight:600;cursor:pointer}
.rules summary::-webkit-details-marker{display:none}
.rules summary svg{width:13px;height:13px;color:var(--label3);transition:transform .2s}
.rules[open] summary svg{transform:rotate(90deg)}
.rules ul{margin:0 0 10px;padding:0;list-style:none}
.rules li{font-size:15px;color:var(--label2);padding:7px 0;border-top:.5px solid var(--sep);line-height:1.35}
.rules li b{color:var(--label);font-weight:600}
.foot{text-align:center;font-size:12px;color:var(--label3);margin-top:22px;line-height:1.5}

/* rest hero */
.rest .fbig{height:150px;border-radius:16px;background:var(--tb,var(--thumb));margin-top:14px}
.rest .fbig svg{width:100%;height:100%}
.rest p{margin:10px 0 0;font-size:15px;color:var(--label2);line-height:1.4}

/* ---------- figures ---------- */
.fig .lim,.fig .tor{fill:none;stroke:var(--fc);stroke-linecap:round;stroke-linejoin:round}
.fig .ua{stroke-width:6.4}.fig .fa{stroke-width:5.5}.fig .th{stroke-width:7.8}.fig .shn{stroke-width:6.5}.fig .fot{stroke-width:5.4}.fig .tor{stroke-width:10.8}
.fig .frontT{fill:var(--fc);stroke-width:6}
.fig .hed{fill:var(--fc)}
.fig .far{opacity:.36}
.fig .ko{fill:none;stroke:var(--kb,var(--thumb));stroke-linecap:round;stroke-linejoin:round}
.fig .uaK{stroke-width:9.4}.fig .faK{stroke-width:8.5}.fig .thK{stroke-width:10.8}.fig .shK{stroke-width:9.5}.fig .ftK{stroke-width:8.4}.fig .torK{stroke-width:13.8}.fig .frontK{stroke-width:9}
.fig .koF{fill:var(--kb,var(--thumb))}
.fig .flr{stroke:var(--sep);stroke-width:1.3;stroke-linecap:round}
.fig .pl,.fig .bar{stroke:var(--propLine);stroke-width:2.2;stroke-linecap:round;fill:none}
.fig .pf{fill:var(--prop);stroke:var(--kb,var(--thumb));stroke-width:1.6;paint-order:stroke}
.fig .pf2{fill:var(--prop2)}
.fig .ph{fill:var(--kb,var(--thumb))}
.fig .pad{stroke:var(--prop);stroke-linecap:round;fill:none}
.fig .post{stroke:var(--prop2);stroke-width:2.6;stroke-linecap:round}
.fig .rail{stroke:var(--prop2);stroke-width:1.6;stroke-linecap:round}
.fig .cb{stroke:var(--propLine);stroke-width:.9}
.fig .rp{fill:none;stroke:var(--propLine);stroke-width:2.2;stroke-linecap:round}
.fig .bd{fill:none;stroke:var(--green);stroke-width:1.8;stroke-linecap:round}
.fig .acc{fill:var(--fc)}
@supports (background:color-mix(in srgb,red 10%,white)){
  .tint{--tb:color-mix(in srgb,var(--fc) 10%,var(--card));--kb:var(--tb)}
  .upn{background:color-mix(in srgb,var(--fc) 7%,var(--card))}
  .upn .fbox{--tb:color-mix(in srgb,var(--fc) 13%,var(--card));--kb:var(--tb)}
}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;transition:opacity .3s;z-index:40}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--elev);border-radius:14px 14px 0 0;max-height:calc(100% - env(safe-area-inset-top,0px) - 18px);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .42s cubic-bezier(.2,.9,.25,1);box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sheet.on{transform:none}
.sheet .grab{flex:none;padding:7px 0 4px;display:grid;place-items:center;touch-action:none;cursor:grab}
.sheet .grab i{width:36px;height:5px;border-radius:3px;background:var(--label3)}
.sheet .sbody{overflow:auto;padding:0 18px calc(env(safe-area-inset-bottom,0px) + 22px);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.shh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 0 12px}
.shh .k{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--fc);display:flex;align-items:center;gap:7px}
.bigfig{border-radius:20px;background:var(--tb,var(--thumb));aspect-ratio:1.18;max-height:44vh;width:100%;display:grid;place-items:center;overflow:hidden}
.bigfig svg{width:min(100%,46vh);height:100%}
.sheet h2{margin:16px 0 0;font-size:26px;line-height:31px;font-weight:800;text-wrap:balance}
.cue{margin:6px 0 0;font-size:16px;color:var(--label2);line-height:1.4}
.sets{margin-top:18px}
.sets .lab{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px}
.sets .bs{display:flex;gap:10px;flex-wrap:wrap}
.setb{width:54px;height:54px;border-radius:50%;border:2px solid var(--label3);font-family:var(--round);font-weight:700;font-size:20px;display:grid;place-items:center;transition:all .2s cubic-bezier(.3,1.5,.5,1);font-variant-numeric:tabular-nums}
.setb.on{background:var(--fc);border-color:var(--fc);color:#fff}
.setb:active{transform:scale(.92)}
.donebtn{margin-top:18px;width:100%;height:52px;border-radius:14px;background:var(--fill);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px}
.donebtn svg{width:16px;height:16px}
.donebtn.on{background:var(--green);color:#fff}
.grp{margin-top:18px;background:var(--fill);border-radius:14px;overflow:hidden}
.grp .gi{display:flex;align-items:center;gap:12px;padding:10px 12px;min-height:58px;width:100%;text-align:left}
.grp .gi+.gi{border-top:.5px solid var(--sep)}
.grp .gi .thumb{width:44px;height:44px;border-radius:10px}
.grp .gi .t1{font-size:13px;color:var(--label2);font-weight:600}
.grp .gi .t2{font-size:16px;font-weight:600;margin-top:1px}
.grp .gi .go{margin-left:auto;font-size:15px;font-weight:600;color:var(--blue);white-space:nowrap}
.grp .gi .ic{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--card);flex:none}
.grp .gi .ic svg{width:22px;height:22px}
.yt{color:#FF0000}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;height:32px;border-radius:7px;font-size:14px;font-weight:600;color:var(--label)}
.seg button.on{background:var(--elev);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px}
.setrow+.setrow{border-top:.5px solid var(--sep)}
.setrow .t2{font-size:16px;font-weight:600}
.setrow .t3{font-size:13px;color:var(--label2);margin-top:2px}
.sw-tog{width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;transition:background .2s;flex:none}
.sw-tog::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.sw-tog.on{background:var(--green)}
.sw-tog.on::after{transform:translateX(20px)}
.danger{color:var(--red)!important}
.confirm{display:flex;gap:8px;padding:0 14px 12px}
.confirm button{flex:1;height:40px;border-radius:10px;font-weight:600;font-size:15px;background:var(--card)}

/* ---------- player ---------- */
.player{position:fixed;inset:0;z-index:60;background:#000;color:#fff;display:flex;flex-direction:column;opacity:0;transform:scale(1.04);transition:opacity .3s,transform .35s cubic-bezier(.2,.9,.25,1);
  --bg:#000;--card:#1C1C1E;--thumb:#1C1C1E;--label:#fff;--label2:rgba(235,235,245,.62);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.55);--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.36);
  --teal:#40C8E0;--mint:#63E6E2;--orange:#FF9F0A;--pink:#FF375F;--indigo:#7D7AFF;--purple:#BF5AF2;--green:#30D158;--prop:#55555B;--prop2:#38383C;--propLine:#98989F;color-scheme:dark;--rs:min(150px,18vh)}
.player.on{opacity:1;transform:none}
.ptop{padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.ptop .icbtn{background:rgba(118,118,128,.28);color:#fff}
.ptop .mid{text-align:center;min-width:0}
.ptop .k{font-size:13px;font-weight:700;color:var(--fc);text-transform:uppercase;letter-spacing:.04em}
.ptop .s{font-size:13px;color:var(--label2);margin-top:1px;font-family:var(--round);font-variant-numeric:tabular-nums}
.pbar{display:flex;gap:3px;padding:0 16px}
.pbar i{flex:1;height:4px;border-radius:2px;background:rgba(118,118,128,.32);overflow:hidden;position:relative}
.pbar i b{position:absolute;inset:0;background:var(--c,#fff);transform-origin:left;transform:scaleX(0);transition:transform .3s}
.pmain{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 20px 0;gap:6px}
.pfig{width:min(76vw,34vh,400px);aspect-ratio:1;border-radius:28px;background:#141416;--kb:#141416;--tb:#141416;position:relative;flex:none}
.pfig svg{width:100%;height:100%}
.pfig .side{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-size:13px;font-weight:700;background:var(--fc);color:#000;padding:5px 11px;border-radius:99px;opacity:0;transition:opacity .3s}
.pfig .side.on{opacity:1}
.pname{margin-top:12px;font-size:28px;line-height:33px;font-weight:800;text-align:center;text-wrap:balance}
.pdose{font-size:17px;color:var(--label2);text-align:center;line-height:1.35;max-width:440px}
.pnote{font-size:14px;font-weight:600;color:var(--fc);text-align:center;max-width:360px;line-height:1.35}
.pnote:empty{display:none}
.pclock{margin-top:10px;display:flex;align-items:center;justify-content:center}
.pr2{position:relative;width:var(--rs);height:var(--rs)}
.pr2 svg{width:100%;height:100%}
.pr2 .tr{fill:none;stroke:rgba(118,118,128,.28);stroke-width:7}
.pr2 .pg{fill:none;stroke:var(--fc);stroke-width:7;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.pr2 .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.pr2 .ph{font-size:12px;font-weight:700;color:var(--fc);text-transform:uppercase;letter-spacing:.06em}
.pr2 .tm{font-family:var(--round);font-weight:700;font-size:calc(var(--rs) * .33);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pr2 .tm.sm{font-size:calc(var(--rs) * .22)}
.pctl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 26px calc(env(safe-area-inset-bottom,0px) + 18px);gap:16px}
.pctl .side{display:flex;justify-content:center}
.pctl .sm{width:56px;height:56px;border-radius:50%;background:rgba(118,118,128,.24);display:grid;place-items:center;color:#fff}
.pctl .sm svg{width:22px;height:22px}
.pctl .sm:disabled{opacity:.3}
.pctl .big{min-width:92px;height:92px;border-radius:46px;background:var(--fc);color:#000;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 26px;font-weight:800;font-size:19px;transition:transform .12s}
.pctl .big:active{transform:scale(.95)}
.pctl .big svg{width:30px;height:30px}
.pnext{display:flex;align-items:center;gap:10px;justify-content:center;font-size:14px;color:var(--label2);padding:0 20px 2px;min-height:40px}
.pnext .thumb{width:36px;height:36px;border-radius:9px;background:#1C1C1E;--kb:#1C1C1E}
.pnext b{color:#fff;font-weight:600}
.pring{position:relative;width:96px;height:96px;flex:none}
.pring svg{width:96px;height:96px;transform:rotate(-90deg)}
.pring .tr{fill:none;stroke:rgba(118,118,128,.3);stroke-width:8}
.pring .pg{fill:none;stroke:var(--fc);stroke-width:8;stroke-linecap:round}
.pdone{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}

.pdone p{margin:0;color:var(--label2);font-size:17px}
.lead{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--round);font-weight:800;font-size:96px;color:#fff;background:rgba(0,0,0,.55);border-radius:28px;opacity:0;pointer-events:none;transition:opacity .2s}
.lead.on{opacity:1}
.lead small{display:block;font-family:var(--font);font-size:15px;font-weight:700;text-align:center;color:var(--fc);text-transform:uppercase;letter-spacing:.05em}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.intro .hdr,.intro .week,.intro .hero,.intro .sec{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.intro .week{animation-delay:.05s}.intro .hero{animation-delay:.1s}.intro .sec:nth-of-type(1){animation-delay:.15s}.intro .sec:nth-of-type(2){animation-delay:.2s}.intro .sec:nth-of-type(n+3){animation-delay:.25s}
@keyframes pulse{0%{transform:scale(1)}35%{transform:scale(1.14)}100%{transform:scale(1)}}
.ring.pulse{animation:pulse .6s cubic-bezier(.3,1.5,.5,1)}
@media (min-width:600px){ .hdr h1{font-size:38px} }
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}

      if (P.state === 'pause') { startTimer(0); return; }
    }
    function complete(s) {
      if (!s || s.kind === 'rest') return;
      var st = dayState(plan.key);
      if ((st.d[s.key] || 0) < s.round) { st.d[s.key] = s.round; commitDay(plan.key); refresh(true); }
      paintBar();
    }
    function advance() {
      var s = cur();
      P.autoChain = !!(s && s.chain && steps[P.i + 1] && steps[P.i + 1].chain && steps[P.i + 1].b === s.b);
      if (P.i + 1 >= steps.length) { finish(); return; }
      P.i++; show();
    }
    function go(d) {
      P.autoChain = false;
      var j = P.i + d;
      while (j >= 0 && j < steps.length && steps[j].kind === 'rest') j += d;
      if (j < 0 || j >= steps.length) { if (d > 0) finish(); return; }
      P.i = j; P.done = false; figBox.style.display = ''; prevB.style.visibility = ''; nextB.style.visibility = ''; show();
    }
    function finish() {
      P.done = true; P.state = 'done'; beep(880, 0.15); setTimeout(function () { beep(1320, 0.3); }, 160);
      figBox.textContent = ''; P.figKey = ''; figBox.style.display = 'none'; prevB.style.visibility = 'hidden'; nextB.style.visibility = 'hidden';
      var frac = dayProg(plan);
      nameEl.textContent = ''; doseEl.textContent = ''; noteEl.textContent = ''; clock.textContent = ''; nextEl.textContent = '';
      var mins = Math.max(1, Math.round((Date.now() - P.t0) / 60000));
      put(clock, h('div', { class: 'pdone' }, h('div', { class: 'ok' }, icon('check')), h('h2', { text: frac >= 1 ? 'Workout complete' : 'Session ended' }),
        h('p', { text: Math.round(frac * 100) + '% of today ticked off · ' + mins + ' min' })));
      root.className = 'player on c-green'; kEl.textContent = plan.title; sEl.textContent = '';
      paintMain(); paintBar();
    }
    function close() {
      PL = null; wake(false); window.__gtBusy = false;
      root.classList.remove('on'); document.documentElement.style.overflow = '';
      setTimeout(function () { root.remove(); }, 320);
      render(true);
    }
    P.close = close;
    P.sync = function () { paintBar(); refresh(false); };
    P.tick = function (now) {
      if (P.state !== 'run' && P.state !== 'lead') return;
      var s = cur();
      if (P.state === 'lead') {
        var lr = (P.leadEnd - now) / 1000, ls = Math.ceil(lr);
        var ln = $('.ln', lead); if (ln && ln.textContent !== String(ls) && ls > 0) { ln.textContent = String(ls); beep(660, 0.12); }
        if (lr <= 0) { P.state = 'run'; lead.classList.remove('on'); beep(1046, 0.22, 0.28); paintMain(); }
        return;
      }
      var rem = (P.end - now) / 1000, sec = Math.ceil(rem);
      if (tmEl) {
        if (s.prog) {
          var el = P.total - rem, acc = 0, k = 0;
          while (k < s.prog.length - 1 && el >= acc + s.prog[k][0]) { acc += s.prog[k][0]; k++; }
          var segRem = acc + s.prog[k][0] - el;
          if (k !== P.segIdx) { if (P.segIdx >= 0) beep(k % 2 ? 1046 : 784, 0.3, 0.28); P.segIdx = k; phEl.textContent = s.prog[k][1] + (s.prog.length > 2 && k > 0 && k < s.prog.length - 1 ? ' · ' + Math.ceil(k / 2) + ' of 8' : ''); }
          tmEl.textContent = fmt(segRem); doseEl.textContent = fmt(rem) + ' left in total';
          setRing(ringEl, segRem / s.prog[k][0]);
        } else { tmEl.textContent = fmt(rem); setRing(ringEl, rem / P.total); }
      }
      if (sec !== P.lastSec) {
        P.lastSec = sec;
        if (sec <= 3 && sec >= 1 && P.total >= 10) beep(sec === 1 ? 740 : 660, 0.12);
        var it = s.b.items[s.ii];
        var half = /per side/.test(it.dose || '') ? 'Switch sides' : /backs of hands/.test(it.dose || '') ? 'Backs of hands' : '';
        if (s.kind === 'timed' && half && Math.abs(rem - P.total / 2) < 0.5 && !sideTag.classList.contains('on')) { sideTag.textContent = half; sideTag.classList.add('on'); beep(988, 0.25); setTimeout(function () { sideTag.classList.remove('on'); }, 2600); }
      }
      if (rem <= 0) {
        P.state = 'idle'; beep(1046, 0.3, 0.28);
        if (s.kind !== 'rest') complete(s);
        var nxt = steps[P.i + 1];
        if (s.kind === 'timed' && !s.chain && nxt && nxt.kind !== 'rest' && !s.prog) { setTimeout(function () { if (PL === P && cur() === s) advance(); }, 700); }
        else setTimeout(function () { if (PL === P && cur() === s) advance(); }, s.kind === 'rest' || s.kind === 'work' ? 50 : 600);
      }
    };
    show();
    kick();
  }

  /* ---------------- boot ---------------- */
  render();
  initDb();
})();

</script>

if ('serviceWorker' in navigator) {
  var hadSW = !!navigator.serviceWorker.controller, reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!hadSW || reloaded) return;
    function go() { if (window.__gtBusy) { setTimeout(go, 3000); return; } reloaded = true; location.reload(); }
    go();
  });
  addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
